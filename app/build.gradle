plugins {
    id 'com.android.application'
}

android {
    namespace 'com.liuhong.xiangqi'
    compileSdk 34

    defaultConfig {
        applicationId "com.liuhong.xiangqi"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        ci {
            storeFile file('xiangqi.keystore')
            storePassword 'xiangqi2026'
            keyAlias 'xiangqi'
            keyPassword 'xiangqi2026'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ci
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.ci
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
